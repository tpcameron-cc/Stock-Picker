# stock-picker settings
# Every tunable number lives here, not in code. Values are read by core/config.py.
# API keys are NEVER written here: each key field names an environment variable.

account:
  # Account size in USD for risk-and-sizing. Leave null here: it is asked once and stored in
  # config/local.yaml (gitignored, overrides this file) so personal numbers never reach git.
  #   uv run python -m core.risk --set-account 50000
  size_usd: null

paths:
  cache_dir: data/cache          # gitignored on-disk cache for provider responses
  reports_dir: reports           # dated markdown + CSV outputs
  journal: data/journal.sqlite   # paper-trade journal (gitignored; back it up if you care about the history)

# ---------------------------------------------------------------------------
# Skill 4: catalyst-plays
# ---------------------------------------------------------------------------
catalyst:
  lookahead_days: 21             # calendar days ahead to look for earnings ("next 3 weeks")
  lookback_trading_days: 10      # drift scan: reported within the last 10 trading days
  max_candidates: 120            # most liquid N reporters per list; drift names are pre-filtered on price first
  history_period: 5y             # price history for past earnings reactions
  history_quarters: 12           # quarters of earnings history scored
  min_history_quarters: 6        # fewer usable quarters -> no play (watch only, low confidence)
  runup_window_days: 10          # pre-earnings run-up: close 10 sessions before -> close before the report
  drift_window_days: 20          # post-earnings drift: reaction-day close -> 20 sessions later

  scoring:                       # points; total capped at 100
    beat_history: 30             # beat rate scaled from 50% (0 pts) to 100% (max)
    revisions: 20                # estimates rising into the report = max; flat = half; falling = 0
    implied_vs_actual: 20        # implied move cheap vs typical actual move = max; fair = half; rich = 0
    drift_history: 15            # avg 20-day drift after beats, scaled to +5% = max
    runup_history: 15            # run-up hit rate scaled from 50% (0) to 100% (max)
    negative_catalyst_penalty: 15  # per negative flag (lockup expiry, recent offering)
    min_score: 45

  revisions_tolerance: 0.01      # 30-day change in the current-quarter EPS estimate beyond +-1% = up/down

  play:
    entry_zone_pct: 0.01         # entry zone = last close +-1%
    runup_min_hit_rate: 0.65     # run-up play: stock rose into >= 65% of past reports...
    runup_min_avg: 0.02          # ...by >= 2% on average
    runup_min_days: 3            # need at least 3 sessions left before the exit day
    runup_atr_stop_mult: 1.5     # run-up stop = close - 1.5 ATR
    hold_min_beat_rate: 0.75     # hold-through play: beat >= 75% of the time...
    hold_requires_revisions_up: true   # ...with estimates rising...
    cheap_implied_ratio: 0.8     # ...and implied move <= 80% of the average actual move ("cheap")
    rich_implied_ratio: 1.2      # implied move >= 120% of the average actual move = "rich"
    hold_stop_implied_mult: 1.0  # hold-through stop = close x (1 - implied move); gaps can blow through it
    hold_days_after_report: 3    # hold-through plans end 3 sessions after the reaction day

  drift:
    big_beat_pct: 5.0            # EPS surprise >= 5%
    min_gap_pct: 0.03            # reaction-day open >= 3% above the prior close
    min_rvol: 2.0                # reaction-day volume >= 2x the prior 50-day average
    guidance_proxy_min_change: 0.01  # current-FY or next-Q EPS estimate up >= 1% in 30d (proxy for raised guidance)
    require_guidance_proxy: true # reject if estimates FELL after the report; unknown = allowed, low confidence
    min_hold_sessions: 1         # "holding above the gap" needs >= 1 session after the reaction day
    entry_zone_pct: 0.02         # entry zone = last close +-2%
    max_stop_pct: 0.12           # stop = reaction-day low; reject if more than 12% below entry
    target_r: 2.0                # target = 2R (drift has no natural measured target; labeled)
    min_horizon_days: 5
    scoring: {beat: 25, gap: 20, rvol: 15, guidance: 20, holding: 20}

  options:
    max_spread_pct: 0.25         # straddle bid/ask spread above 25% of mid -> implied move flagged unreliable
    baseline_vol_days: 60        # realized daily vol removed from the straddle to isolate the earnings move

  negative:
    lockup_days: 180             # IPO lockup estimated at first trade date + 180 days (convention, not filed date)
    lockup_warn_days: 30         # flag if the estimated expiry is within the next 30 days...
    lockup_recent_days: 5        # ...or passed within the last 5 days
    offering_lookback_days: 90   # S-1/S-3/424B5 filed in the last 90 days -> flag (needs SEC_USER_AGENT)

  output_top_n: 20

# ---------------------------------------------------------------------------
# Skill 1: political-edge (House PTR PDFs + Senate eFD PTRs)
# ---------------------------------------------------------------------------
political:
  years_back: 2                  # PTR filing years to ingest (2 = this year + last; 4 enables the 3Y window)
  house:
    min_seconds_between_calls: 0.5
  senate:
    enabled: true                # eFD terms accepted by the user 2026-11-16 (personal, non-commercial use)
    min_seconds_between_calls: 1.0
  jurisdiction_file: config/committee_jurisdiction.yaml

  screen:                        # Step A: which members' trades to follow
    # gate  = member must beat SPY (copy-trade, 1Y) and not only via one stock (the screen until 2026-11-16).
    # score = beating SPY is not required; past performance becomes a score component (scoring.member_performance_*).
    # All other screen criteria (trades, filing delay, reliability, portfolio size) apply in both modes.
    performance_mode: score
    window_days: 365             # main performance window (1Y)
    window_days_long: 1095       # 3Y, shown only if enough filing years are ingested
    reliability_max_gap_pp: 5    # |copy-trade return - delay-adjusted return| <= 5 percentage points
    min_portfolio_usd: 1000000   # estimated PTR-traded portfolio (amount-range midpoints, marked to market)
    min_trades: 10               # stock/option trades in the window
    max_median_filing_delay: 30  # days from trade to filing
    late_filing_days: 45         # STOCK Act deadline
    max_late_share: 0.20         # > 20% of trades filed after 45 days = chronic late filer (excluded)
    options_heavy_share: 0.30    # >= 30% option trades -> flagged
    exception_min_excess_pp: 10  # small portfolios kept if they beat SPY by >= 10pp...
    exception_min_top_weight: 0.40  # ...or have an unusual allocation (top position >= 40% of the book)
    reference_exceptions: [Wasserman Schultz, Fetterman]   # user's examples; reported on whenever present

  purchases:
    lookback_days: 90            # Step C: classify purchases from the last 90 days
    contracts_lookback_days: 730 # federal contract obligations considered for DIRECT links
    min_contract_usd: 10000000   # >= $10M obligated by a member's committee agencies = DIRECT
    broad_vendor_share: 0.25     # if those agencies are < 25% of the company's federal contract $, flag "broad vendor"
    timing_window_days: 30       # trade within 30 days before a related contract action -> timing flag
    min_timing_action_usd: 5000000
    require_overlap: true        # only DIRECT / SECTOR purchases become Signals (NONE listed for context)

  scoring:
    direct: 40
    sector: 20
    agreement_per_member: 10     # other qualifying members buying the same name in the lookback
    agreement_max: 20
    size_max: 15                 # scaled on a log scale from $1k to size_full_usd
    size_full_usd: 250000
    recency_max: 10              # full points within 30 days of the trade, 0 at the lookback limit
    recency_full_days: 30
    insider_cluster: 10          # corporate insiders' open-market buys (Form 4, needs SEC_USER_AGENT)
    late_filing_penalty: 10      # this trade filed > max_median_filing_delay days after the trade
    move_penalty_start: 0.15     # price already up > 15% since disclosure -> penalty...
    move_penalty_max: 15         # ...scaling to -15 at +30%
    # Score mode only: the member's DELAY-ADJUSTED 1Y excess vs SPY, shrunk for small samples
    # (excess * n_buys / (n_buys + shrink_buys)), scaled to +-max points at +-full. Trailing SPY costs points.
    # 0 (user, 2026-11-16): the persistence walk-forward found no predictive value (rank corr -0.08 [-0.21, +0.05]).
    member_performance_max: 0
    member_performance_full: 0.10      # shrunk excess of +-10pp = full points
    member_performance_shrink_buys: 20 # a member with 20 buys keeps half their excess; 60 buys keep 75%
    min_score: 40

  plan:
    entry_zone_pct: 0.02
    atr_stop_mult: 2.0
    max_stop_pct: 0.15
    target_r: 2.0                # no measured target for a disclosure signal: 2R, labeled
    horizon_days: 126            # ~6 months: disclosure ideas can take longer to play out (user, 2026-11-17)
    entry_mode: limit            # buy when price trades into the entry zone (limit order at the top of the zone)...
    entry_window_days: 10        # ...within 10 sessions of the first allowed session, else the idea expires

  # Sell blacklist (user, 2026-11-17): a big sale by a qualifying member blocks the stock from the daily list.
  blacklist:
    enabled: true
    days: 90                     # blocked for 90 calendar days from the sale's trade date
    # Whose sales count: qualified_beat_spy = pass the screen AND beat SPY (the rule as set 2026-11-17, kept when
    # the screen moved to score mode) | qualified = pass the screen in its current mode | all = every member.
    members: qualified_beat_spy
    min_amount_low_usd: 15001    # the reported sale range must start above $15,000
    min_fraction: 0.75           # and the sale is >= 75% of their position: a FULL sale, or a partial sale whose
                                 # amount is >= 75% of the position estimated from their own disclosed trades
                                 # (range midpoints). Unknown position (bought before the data) -> no trigger.
    file: data/political_blacklist.json   # latest list, read by run-all-scans (gitignored with data/)

  # Walk-forward test: does a member's past copy-trade performance predict their NEXT purchases?
  #   uv run python -m scanners.political.persistence     (read-only; never changes settings)
  persistence:
    years: 4                     # PTR filing years to load (needs >= 2; each formation date needs 1Y of history)
    step_days: 91                # a new formation date every quarter; purchases FILED in the next quarter are followed
    horizon_days: 126            # sessions each followed purchase is held (= plan.horizon_days)
    bootstrap_samples: 5000      # cluster bootstrap: members are resampled, all their purchases together
    ci_level: 0.90
    min_members: 5               # fewer members on either side of a comparison -> "too few to judge"

# ---------------------------------------------------------------------------
# Skill 3: momentum-hype (attention accelerating AND price confirming; high risk by definition)
# ---------------------------------------------------------------------------
hype:
  snapshot_dir: data/attention   # daily attention snapshots (gitignored); they build the 30-day baseline over time
  baseline_days: 30              # mention baseline window once enough snapshots exist...
  min_baseline_days: 5           # ...fewer snapshot days -> baseline = yesterday's count (flagged, lower confidence)
  apewisdom_pages: 3             # Reddit/4chan mention leaderboard pages to read (100 tickers each)
  min_mentions: 15               # ignore tickers with fewer Reddit mentions in the last 24h
  baseline_floor: 15             # baseline never below 15 mentions: 92 vs 1 yesterday is noise, not a 92x surge
  # Tickers that are everyday words: forum mention counts can be inflated by ordinary text -> flagged.
  ambiguous_tickers: [AI, ALL, IT, NOW, ON, OPEN, GO, DD, EV, CEO, FUN, LOVE, BIG, ONE, ARE, SO, CAN, REAL, RUN,
                      PLAY, CASH, GAIN, MOVE, KEY, LOW, HIGH, CAR, BE, AN, OR, HAS, BIT, NEW, BEST, TRUE, WELL, PEAK]
  max_shortlist: 25              # confirmed names that get the slow checks (news, options, short interest)

  attention:                     # points; total capped at 100
    reddit_velocity: 30          # mentions / baseline, scaled from 1.5x (0) to 5x (max)
    news_velocity: 25            # headlines today / 30-day daily average, scaled 1.5x -> 5x
    stocktwits_trending: 20      # StockTwits trending rank 1 = max, rank 30 = ~0
    wsb_comments: 10             # r/wallstreetbets comment count (log-scaled to 300); 0 if sentiment bearish
    call_volume: 15              # near-dated call volume / call open interest, scaled 0.25 (0) -> 1.0 (max)
    velocity_floor: 1.5
    velocity_full: 5.0

  confirm:                       # price must confirm the hype (all required)
    sma_fast: 10
    sma_slow: 20
    rising_lookback: 3           # both averages higher than 3 sessions ago
    min_rvol: 2.0                # today's volume >= 2x the prior 50-day average
    close_in_range_min: 0.6      # close in the top 40% of the day's range ("holding gains into the close")

  late_stage:                    # reject
    max_atr_above_sma20: 3.0     # close more than 3 ATRs above the 20-day average
    max_gain_5d: 1.00            # up more than 100% in 5 sessions
    fade_ratio: 0.6              # mentions < 60% of their recent peak (or of yesterday) = attention past its peak

  pump:                          # flag (and penalize); never silently pass
    pennystocks_min_mentions: 5  # mentioned in r/pennystocks
    min_market_cap: 300000000    # micro caps under $300M
    penalty: 15                  # score points per pump flag
    reject_on_flags: 2           # 2+ pump flags -> reject

  squeeze:                       # context only
    short_pct_float: 0.20
    days_to_cover: 5

  plan:
    entry_zone_pct: 0.015
    stop_atr_mult: 1.0           # tight stop: the higher of today's low and close - 1 ATR
    target_rs: [2.0, 3.0]        # scale out: half at 2R, rest at 3R
    time_stop_days: 5            # spec range 3-10 sessions
  min_score: 40

# ---------------------------------------------------------------------------
# Market regime (checked first by run-all-scans)
# ---------------------------------------------------------------------------
regime:
  sector_etfs: [XLB, XLC, XLE, XLF, XLI, XLK, XLP, XLRE, XLU, XLV, XLY]   # breadth = share above their 50-day
  equal_weight: RSP              # equal-weight S&P vs SPY: is the rally broad?
  vix: ^VIX
  breadth_min: 0.5               # >= 50% of sectors above their 50-day average = healthy breadth
  vix_calm: 20                   # VIX below 20 = calm
  vix_rising_ratio: 1.10         # VIX > 110% of its 20-day average = rising fear
  slope_lookback: 10             # SMA50 higher than 10 sessions ago = rising
  equal_weight_lookback: 20      # RSP/SPY ratio change over 20 sessions
  strong_min_points: 5           # of 7 bullish checks: >= 5 strong, 3-4 neutral, <= 2 weak
  weak_max_points: 2
  actions:                       # what run-all-scans does in each regime
    strong:  {min_score_add: 0,  size_multiplier: 1.0}
    neutral: {min_score_add: 5,  size_multiplier: 0.75}
    weak:    {min_score_add: 15, size_multiplier: 0.5}

# ---------------------------------------------------------------------------
# Skill 6: run-all-scans (orchestrator) and Skill 7: review-performance
# ---------------------------------------------------------------------------
orchestrator:
  skills: [political-edge, breakout-scanner, momentum-hype, catalyst-plays]
  min_score: 40                  # merged ideas below (min_score + regime add) are rejected
  confluence_bonus: 10           # per additional skill flagging the same ticker
  conflict_penalty: 10           # per conflict (e.g. breakout with earnings in 3 sessions)
  earnings_conflict_sessions: 3
  top_n: 10
  quick_top_n: 5
  quick_limit: 1500              # --quick: breakout / catalyst scan only the first N listed stocks, cached data
  timeout_minutes: 60            # per scanner process
  # Skills score on different point systems, so ideas are RANKED on a common scale (core/calibrate.py):
  # percentile of the score within its own skill's past journal scores + the skill's realized expectancy.
  # min_score above still gates on the primary skill's own scale; confluence / conflict points apply to both.
  calibration:
    enabled: true                # false = rank by raw scores (the behaviour before 2026-11-16)
    lookback_days: 365           # past journal scores per skill used as the percentile reference
    prior_weight: 20             # pseudo-scores spread uniformly over [skill min_score, 100]: history takes over as it grows
    edge_shrink_trades: 30       # skill expectancy shrunk by n / (n + 30) closed ideas (= review.min_closed_trades)
    edge_points_per_r: 25        # +0.2R shrunk expectancy = +5 priority points...
    edge_max_points: 15          # ...capped at +-15

review:
  min_closed_trades: 30          # fewer closed trades per skill -> "too early to judge"
  bootstrap_samples: 2000
  noise_band_r: 0.0              # expectancy CI entirely above this = adding value; entirely below = negative
  bad_signal_r: -0.2             # signal types averaging below -0.2R (with enough trades) -> suggestion

# ---------------------------------------------------------------------------
# Skill 5: risk-and-sizing (paper sizing only; nothing here places orders)
# ---------------------------------------------------------------------------
risk:
  risk_per_trade_pct: 0.0075     # risk 0.75% of the account per idea (entry -> stop distance)
  entry_for_sizing: high         # size from the top of the entry zone (worst fill) | mid
  max_position_pct: 0.20         # cap any one position at 20% of the account, even if the stop is tight
  min_shares: 1                  # below this the idea is too small to take
  min_reward_risk: 2.0           # reject ideas below 2:1 (target vs stop, from the middle of the entry zone)
  # Earnings plays whose target is a typical earnings move can't reach 2:1 by construction (decided 2026-11-16):
  # they skip the R:R rule, qualify on historical odds (catalyst play rules), and are sized smaller.
  rr_exempt_setups: [earnings_run_up, earnings_hold_through]
  rr_exempt_size_multiplier: 0.5 # exempt ideas risk half the normal amount (0.375% of the account)
  setup_size_multipliers:        # smaller default size for inherently riskier setups (stacks with the above)
    momentum_hype: 0.5
  max_open_positions: 8          # open + pending paper trades in the journal count toward this
  max_per_sector: 2              # at most 2 positions per sector (unknown sector = flagged, not capped)
  correlation_lookback_days: 60  # daily-return correlation window vs existing positions
  max_correlation: 0.75          # above this, the idea duplicates an existing bet...
  correlation_action: reject     # ...reject | flag
  size_multiplier: 1.0           # orchestrator lowers this in a weak market regime

# ---------------------------------------------------------------------------
# Paper-trade journal
# ---------------------------------------------------------------------------
journal:
  pending_days: 5                # a buy-stop / next-open entry that hasn't filled after 5 bars expires
  same_bar_rule: stop_first      # same conservative fill rules as the backtest
  slippage_pct: 0.001            # 0.10% per side, same as the backtest
  log_rejected: true             # also track ideas risk-and-sizing rejected (taken = 0) to test the filters

universe:
  # Where the candidate ticker list comes from:
  #   nasdaqtrader -> every Nasdaq/NYSE/NYSE American/Arca/Cboe-listed common stock
  #                   (public Nasdaq Trader symbol directory; OTC is never in it)
  #   list         -> only the tickers in `tickers` below (fast; good for testing)
  source: nasdaqtrader
  tickers: [AAPL, MSFT, NVDA, AMZN, META, GOOGL, LMT, RTX, PLTR, JPM]
  exclude_etfs: true             # drop ETFs/ETNs from the nasdaqtrader list
  exclude_test_issues: true      # Nasdaq Trader marks test symbols; always drop them
  # Symbols with these characters are usually warrants, units, rights or preferreds.
  exclude_symbol_chars: ["$", ".", "+", "^", "="]
  # Case-insensitive regex on the security name. Drops non-common-stock instruments
  # (SPAC warrants/rights/units, preferreds, notes). ADRs are kept.
  exclude_name_regex: '\b(?:warrants?|rights?|units?|preferred|depositary shares? representing|notes? due|debentures?)\b'
  history_period: 2y             # price history per ticker; 2y so SMA200 and 52w RS highs are valid
  download_batch_size: 200       # tickers per yfinance batch download

filters:
  min_price: 3.0                 # USD, last close
  min_avg_dollar_volume: 10000000  # USD, average of close*volume over the window below
  avg_dollar_volume_window: 20   # trading days
  min_history_days: 60           # need at least this many bars to compute anything
  allowed_exchanges:             # Nasdaq Trader exchange codes; anything else (incl. OTC) is rejected
    - Q   # Nasdaq (Global Select / Global / Capital Market)
    - N   # NYSE
    - A   # NYSE American
    - P   # NYSE Arca
    - Z   # Cboe BZX
    - V   # IEX

risk_flags:
  # Dilution / pump-and-dump warnings. These FLAG, they do not reject, unless reject_on_flag is true.
  reverse_split_lookback_days: 365     # reverse split within this window -> flag
  dilutive_filing_lookback_days: 180   # S-1/S-3/ATM prospectus within this window -> flag
  dilutive_forms: ["S-1", "S-1/A", "S-3", "S-3/A", "S-3ASR", "424B5", "F-1", "F-3"]
  # 424B5 is the prospectus supplement typically used for at-the-market (ATM) offerings.
  reject_on_flag: false
  check_edgar_in_universe: false       # EDGAR lookups are 1 request/ticker; run on shortlist only by default

providers:
  yfinance:
    cache_ttl_hours: 12          # price history refresh interval
    min_seconds_between_calls: 0.5
    drop_incomplete_bar: true    # ignore today's bar if fetched before the close (it's partial)
    close_buffer_minutes: 20     # minutes after 16:00 ET before today's bar counts as final
  nasdaqtrader:
    cache_ttl_hours: 24
  edgar:
    cache_ttl_hours: 24
    min_seconds_between_calls: 0.15   # SEC fair-access limit is 10 req/s; stay under it
    # SEC requires a User-Agent with a contact. Set this env var, e.g. "stock-picker you@example.com"
    user_agent_env: SEC_USER_AGENT
  # Optional paid / keyed providers (later stages). Each names an env var, never the key itself.
  polygon:
    api_key_env: POLYGON_API_KEY
  alpaca:
    api_key_env: ALPACA_API_KEY
    secret_key_env: ALPACA_SECRET_KEY
  quiver:
    api_key_env: QUIVER_API_KEY

indicators:
  atr_period: 14
  bollinger_period: 20
  bollinger_std: 2.0
  rsi_period: 14
  rs_lookback_days: 63           # ~3 months for relative-strength vs benchmark
  benchmark: SPY

signals:
  score_min: 0
  score_max: 100

# ---------------------------------------------------------------------------
# Skill 2: breakout-scanner
# ---------------------------------------------------------------------------
breakout:
  # Gates every idea must pass before setups are even scored ("leaders only").
  require_ma_stack: true         # SMA50 > SMA150 > SMA200 and close > SMA50
  rs_min_percentile: 80          # 63-day excess return vs SPY must be in the top 20% of the universe
  near_high_max_pct: 0.25        # close within 25% of the 52-week high (base setups use the tighter value below)

  base:
    length_days: 25              # lookback that defines the base / pivot (excludes today)
    near_high_max_pct: 0.15      # base setups: close within 15% of the 52-week high
    flat_max_depth: 0.15         # flat base: (base high / base low - 1) <= 15%
    squeeze_bw_percentile: 20    # Bollinger bandwidth in its lowest 20% of the last 126 days -> squeeze
    squeeze_atr_ratio: 0.6       # or ATR% <= 60% of its 60-day max -> squeeze
    vcp_segment_days: 10         # VCP: three consecutive 10-day segments...
    vcp_max_final_depth: 0.08    # ...each shallower than the last, final one <= 8% deep
    cup_min_days: 35             # cup-with-handle (heuristic): cup length range in days
    cup_max_days: 130
    cup_min_depth: 0.12          # cup depth from left lip, 12%–35%
    cup_max_depth: 0.35
    cup_lip_tolerance: 0.05      # right side recovers to within 5% of the left lip
    handle_max_days: 20          # handle: last 5–20 days, pullback <= 12%, on lighter volume
    handle_min_days: 5
    handle_max_depth: 0.12
    handle_min_cup_position: 0.5 # handle low must sit in the upper half of the cup (0 = bottom, 1 = lip)

  breakout_day:
    rvol_min: 1.5                # volume >= 1.5x the prior 50-day average
    close_in_range_min: 0.5      # close in the upper half of the day's range

  rs_new_high_tolerance: 0.01    # RS line within 1% of its 252-day high counts as a new high

  pullback:
    ma_touch_tolerance: 0.02     # low within 2% of the rising EMA21 or SMA50, close above it
    ma_rising_lookback: 5        # MA higher than 5 days ago = rising

  plan:
    buy_zone_pct: 0.05           # entry zone = pivot to pivot +5%; above that = extended (rejected)
    max_distance_to_pivot: 0.05  # pre-breakout ideas must be within 5% below the pivot
    atr_stop_mult: 2.0           # ATR stop = entry low - 2 ATR; stop used = the tighter of this and the base low
    max_stop_pct: 0.10           # reject if the stop is more than 10% below entry
    pullback_atr_stop_mult: 1.0  # pullbacks: stop = MA - 1 ATR
    horizon_days: 30             # time stop for the plan (trading days)
    fallback_target_r: 2.0       # if the measured move / prior high isn't above the entry zone, target = 2R (labeled)

  scoring:                       # points per condition; total is capped at 100
    ma_stack: 15
    rs_percentile_max: 20        # scaled linearly from rs_min_percentile (0 pts) to 100th (max)
    rs_new_high: 10
    squeeze: 10
    vcp: 10
    flat_base: 10
    cup_handle: 10
    breakout_day: 15
    pullback: 10
    fundamentals_pass: 10
    min_score: 40                # ideas below this are dropped (listed in rejects)

  fundamentals:
    shortlist_size: 40           # only the top-N technical candidates get (slow) fundamental checks
    max_decel_pp: 25             # "slowing sharply" = YoY growth down more than 25 percentage points...
    strong_growth_floor: 0.50    # ...unless growth is still >= 50% YoY (300% -> 150% is not a problem)
    revision_tolerance: 0.02     # EPS estimate down >2% vs 30 days ago = revisions falling
    earnings_exclusion_days: 5   # earnings within 5 trading days -> excluded, handed to catalyst-plays

  output_top_n: 25
  history_period: 2y

  backtest:
    period: 5y
    max_tickers: 300             # backtest on the first N tickers of the current universe (survivorship bias!)
    signal_step_days: 5          # evaluate signals every 5 trading days
    pending_days: 5              # buy-stop at the pivot stays live this many days
    same_bar_rule: stop_first    # if stop and target are both hit on one bar, assume the stop (conservative)
    slippage_pct: 0.001          # 0.10% cost applied on entry and on exit
