[project]
name = "stock-picker"
version = "0.1.0"
description = "Research-only stock idea scanners sharing one data layer. No order execution."
requires-python = ">=3.11"
dependencies = [
    "pandas>=2.2",
    "numpy>=1.26",
    "pydantic>=2.7",
    "pyyaml>=6.0",
    "yfinance>=0.2.50",
    "requests>=2.32",
    "tzdata>=2024.1",  # zoneinfo data on Windows
    "pdfplumber>=0.11.10",
]

[dependency-groups]
dev = ["pytest>=8.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["core", "scanners"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = ["network: test hits a live data source (deselect with -m 'not network')"]
